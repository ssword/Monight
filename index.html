<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monight (墨页)</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/reader-shell.css" />
    <link rel="stylesheet" href="/src/styles/configurator.css" />
    <link rel="stylesheet" href="/src/styles/tabs.css" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-src blob:; img-src 'self' blob: data:" />
</head>
<body>
    <div id="app">
        <!-- Splash screen shown when no PDF is loaded -->
        <div id="splash-container">
            <h1 class="app-title">Monight</h1>
            <h2 class="app-subtitle">墨页</h2>
            <p class="app-version" id="version-info">Loading...</p>
            <button id="splash-open-btn" class="splash-open-btn">Open PDF File</button>
            <p class="hint-text">Press Cmd+O to open a PDF file</p>
            <section id="recent-files-section" class="recent-files hidden" aria-labelledby="recent-files-title">
                <div class="recent-files-heading">
                    <h3 id="recent-files-title">Recent Documents</h3>
                    <button id="clear-recent-files" type="button">Clear</button>
                </div>
                <div id="recent-files-list" class="recent-files-list"></div>
            </section>
        </div>

        <!-- PDF viewer container (hidden initially) -->
        <div id="viewer-container" class="hidden">
            <!-- Toolbar with controls -->
            <div id="toolbar">
                <!-- Filter preset group -->
                <div class="toolbar-group preset-group">
                    <button id="preset-default" class="preset-btn active" title="Default Dark Mode">
                        <span>Default</span>
                    </button>
                    <button id="preset-original" class="preset-btn" title="Original (No Filter)">
                        <span>Original</span>
                    </button>
                    <button id="preset-redeye" class="preset-btn" title="Redeye Dark Mode">
                        <span>Redeye</span>
                    </button>
                    <button id="preset-sepia" class="preset-btn" title="Sepia Mode">
                        <span>Sepia</span>
                    </button>
                    <button id="preset-custom" class="preset-btn" title="Custom Dark Mode">
                        <span>Custom</span>
                    </button>
                </div>

                <div class="toolbar-group viewer-tools">
                    <button id="presentation-mode" class="toolbar-btn" title="Presentation Mode (Shift+F11)" aria-label="Start presentation mode">
                        <span>▣</span>
                    </button>
                </div>

                <!-- File info -->
                <div class="toolbar-group file-info">
                    <span id="file-name" class="file-name">No file loaded</span>
                </div>

                <!-- Actions -->
                <div class="toolbar-group">
                    <button id="print-file" class="toolbar-btn" title="Print (Ctrl+P)">
                        <span>🖨</span>
                    </button>
                    <button id="open-file" class="toolbar-btn" title="Open PDF (Ctrl+O)">
                        <span>📂</span>
                    </button>
                </div>
            </div>

            <!-- Tab Bar -->
            <div id="tab-bar" class="tab-bar hidden">
                <div id="tab-container" class="tab-list" role="tablist" aria-label="Open documents">
                    <!-- Tabs rendered dynamically -->
                </div>
                <button id="new-tab-btn" class="new-tab-btn" title="Open New PDF (Ctrl+T)">+</button>
            </div>

            <div id="document-workspace" role="tabpanel">
                <!-- PDF canvas container -->
                <div id="pdf-container"></div>
            </div>
        </div>

        <!-- Dark Mode Configurator Overlay -->
        <div id="darkConfigurator" class="dark-configurator hidden">
            <div class="configurator-panel">
                <div class="configurator-header">
                    <h3>Custom Dark Mode</h3>
                    <button id="close-configurator" class="close-btn">✕</button>
                </div>
                <div class="configurator-content">
                    <div class="slider-group">
                        <label>Darkness</label>
                        <div id="brightnessSlider" class="slider"></div>
                    </div>
                    <div class="slider-group">
                        <label>Grayscale</label>
                        <div id="grayscaleSlider" class="slider"></div>
                    </div>
                    <div class="slider-group">
                        <label>Inversion</label>
                        <div id="invertSlider" class="slider"></div>
                    </div>
                    <div class="slider-group">
                        <label>Sepia</label>
                        <div id="sepiaSlider" class="slider"></div>
                    </div>
                    <div class="slider-group">
                        <label>Hue</label>
                        <div id="hueSlider" class="slider"></div>
                    </div>
                    <div class="slider-group">
                        <label>Brightness</label>
                        <div id="extraBrightnessSlider" class="slider"></div>
                    </div>
                </div>
            </div>
        </div>

        <dialog id="password-dialog" class="app-dialog">
            <form method="dialog">
                <h2 data-password-title>Unlock PDF</h2>
                <p data-password-message>This PDF is encrypted.</p>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="off" required />
                </label>
                <div class="dialog-actions">
                    <button type="button" class="dialog-secondary" data-dialog-cancel>Cancel</button>
                    <button type="submit" class="dialog-primary">Unlock</button>
                </div>
            </form>
        </dialog>

        <div id="toast-region" class="toast-region" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
